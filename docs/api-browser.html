<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light"><title>MoonTV · API 资源浏览器</title>
<style>
:root{color-scheme:dark;--bg:#0b0e13;--panel:#141922;--panel2:#1b2330;--line:#293344;--text:#edf2f8;--muted:#8d9aab;--accent:#79a9ff;--chip:#202c3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1280px;margin:auto;padding:26px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{font-size:22px;font-weight:750;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400;letter-spacing:0}.status{color:var(--muted);font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}.controls{display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(180px,1fr) minmax(180px,1fr) auto;gap:10px}.field,button,select{font:inherit}.field,select{width:100%;background:#0e131b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.field:focus,select:focus{border-color:var(--accent)}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer}button.primary{background:#315f9f;border-color:#315f9f}button:disabled{opacity:.45;cursor:not-allowed}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}.tabs button.active{background:#dce9ff;color:#13233a;border-color:#dce9ff}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.meta{color:var(--muted);font-size:12px}.categories{display:flex;gap:7px;overflow:auto;padding:12px 0 2px}.categories button{white-space:nowrap;padding:7px 11px;font-size:13px}.categories button.active{background:var(--chip);border-color:var(--accent);color:#b9d3ff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px}.movie{min-width:0;cursor:pointer}.poster{position:relative;aspect-ratio:2/2.85;background:#202938;border-radius:12px;overflow:hidden;border:1px solid var(--line)}.poster img{width:100%;height:100%;object-fit:cover;display:block}.poster .placeholder{height:100%;display:grid;place-items:center;color:#7f8da1;font-size:13px}.tag{position:absolute;bottom:7px;right:7px;background:#080b10d9;color:#fff;border-radius:6px;padding:3px 6px;font-size:11px}.movie-title{font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.movie-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:60px 15px;text-align:center;color:var(--muted)}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px 0}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.dialog{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:820px;width:100%;max-height:90vh;overflow:auto;padding:20px}.detail{display:grid;grid-template-columns:190px 1fr;gap:20px}.detail img{width:100%;border-radius:12px}.detail h2{margin:0 0 8px}.detail p{color:#b5c0ce;margin:7px 0}.playlist{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.playrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.playrow a{color:#9fc2ff;overflow-wrap:anywhere}.notice{font-size:12px;color:var(--muted);line-height:1.7;margin-top:18px}.adult{color:#ffb0b0}@media(max-width:760px){.shell{padding:18px 13px 45px}.controls{grid-template-columns:1fr 1fr}.controls .wide{grid-column:1/-1}.grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px}.detail{grid-template-columns:105px 1fr;gap:13px}.detail h2{font-size:18px}}@media(max-width:420px){.controls{grid-template-columns:1fr}.controls .wide{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="shell">
<header class="top"><div class="brand">MOONTV <small>API RESOURCE EXPLORER · 独立资源浏览器</small></div><div class="status" id="status">正在连接资源服务…</div></header>
<section class="panel">
<div class="controls">
<select id="source" class="wide"><option>正在加载 63 个资源源…</option></select>
<select id="category"><option value="">全部分类</option></select>
<input id="keyword" class="field" placeholder="搜索影片名称…" autocomplete="off">
<button class="primary" id="search">搜索影片</button>
</div>
<div class="tabs"><button class="active" data-kind="normal">普通源</button><button data-kind="adult">成人源</button><button data-kind="all">全部源</button></div>
<div class="row" style="margin-top:14px"><div class="meta" id="sourceInfo">选择一个资源源开始浏览</div><div class="meta" id="count"></div></div>
<div class="categories" id="categories"></div>
</section>
<section class="panel"><div class="row" style="margin-bottom:15px"><strong id="heading">影片资源</strong><span class="meta" id="pageInfo"></span></div><div id="results" class="grid"><div class="empty">请选择资源源</div></div><div class="pager"><button id="prev">上一页</button><span class="meta" id="page">第 1 页</span><button id="next">下一页</button></div></section>
<p class="notice">资源内容及播放地址由各资源站提供，本站仅负责目录浏览。不同源的接口字段、可用性和播放协议可能不同；部分源可能无法跨境访问或已停止服务。请仅访问你有权使用的内容。</p>
</main>
<div class="modal" id="modal"><div class="dialog"><div class="row" style="margin-bottom:14px"><strong>影片详情</strong><button id="close">关闭</button></div><div id="detailBody"></div><div id="playerWrap" style="display:none;margin-top:16px"><video id="videoPlayer" controls playsinline style="width:100%;max-height:55vh;background:#000;border-radius:12px"></video><div class="meta" id="playerHint" style="margin-top:8px"></div></div></div></div>
<script>
const $=id=>document.getElementById(id);let allSources=[],visibleSources=[],kind="normal",current=null,page=1,pageCount=1,classes=[],lastQuery="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(params={}){const q=new URLSearchParams(params);const r=await fetch("/api/proxy?"+q.toString());const t=await r.text();if(!r.ok)throw Error("资源站返回 HTTP "+r.status+"："+t.slice(0,180));try{return JSON.parse(t)}catch{throw Error("接口没有返回有效 JSON："+t.slice(0,120))}}
function filterSources(){visibleSources=allSources.filter(s=>kind==="all"||(kind==="adult"?(s.name||"").startsWith("🔞"):!(s.name||"").startsWith("🔞")));const old=$("source").value;$("source").innerHTML="";visibleSources.forEach(s=>{const o=document.createElement("option");o.value=s.key;o.textContent=s.name+" · "+s.key;$("source").append(o)});if(visibleSources.some(s=>s.key===old))$("source").value=old;current=visibleSources.find(s=>s.key===$("source").value)||visibleSources[0];$("sourceInfo").textContent=current?current.key:"没有可用源";if(current)loadClassesAndList()}
async function loadConfig(){try{const r=await fetch("/api/config");if(!r.ok)throw Error("配置读取失败");const d=await r.json();allSources=Object.entries(d.api_site||{}).map(([key,v])=>({key,...v}));$("status").textContent="已载入 "+allSources.length+" 个源";filterSources()}catch(e){$("status").textContent=e.message;$("results").innerHTML='<div class="empty">无法读取配置。请确认通过部署后的 Worker 地址访问。</div>'}}
async function loadClassesAndList(){classes=[];$("category").innerHTML='<option value="">全部分类</option>';$("categories").innerHTML="";try{const d=await api({source:current.key,ac:"list"});classes=d.class||d.classes||[];classes.forEach(c=>{const id=c.type_id??c.id,name=c.type_name??c.name;if(id==null||!name)return;const o=document.createElement("option");o.value=id;o.textContent=name;$("category").append(o);const b=document.createElement("button");b.textContent=name;b.dataset.id=id;b.onclick=()=>{$("category").value=id;page=1;loadList()};$("categories").append(b)})}catch(e){$("sourceInfo").textContent=current.key+" · 分类接口不可用（仍可尝试搜索）"}page=1;loadList()}
async function loadList(){if(!current)return;const wd=$("keyword").value.trim();lastQuery=wd;$("results").innerHTML='<div class="empty">正在读取影片…</div>';$("heading").textContent=wd?"搜索结果":"影片资源";try{const p={source:current.key,ac:"videolist",pg:String(page)};if(wd)p.wd=wd;if($("category").value)p.t=$("category").value;const d=await api(p);const list=d.list||d.data||[];pageCount=Math.max(1,Number(d.pagecount||d.page_count||1));$("count").textContent="共 "+(d.total??list.length)+" 条";$("pageInfo").textContent="共 "+pageCount+" 页";$("page").textContent="第 "+page+" 页";$("prev").disabled=page<=1;$("next").disabled=page>=pageCount;renderMovies(list)}catch(e){$("results").innerHTML='<div class="empty">'+esc(e.message)+'</div>';$("count").textContent="接口读取失败";$("prev").disabled=true;$("next").disabled=true}}
function renderMovies(list){$("results").innerHTML="";if(!list.length){$("results").innerHTML='<div class="empty">没有找到影片，试试其他分类或资源源。</div>';return}list.forEach(v=>{const id=v.vod_id??v.id;const title=v.vod_name??v.name??"未命名影片";const pic=v.vod_pic??v.pic??"";const remarks=v.vod_remarks??v.remarks??v.vod_year??"";const card=document.createElement("article");card.className="movie";card.innerHTML='<div class="poster">'+(pic?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(pic)+'" onerror="this.remove()">':'<div class="placeholder">暂无海报</div>')+'<span class="tag">'+esc(remarks)+'</span></div><div class="movie-title">'+esc(title)+'</div><div class="movie-sub">'+esc([v.vod_year,v.vod_area,v.vod_type].filter(Boolean).join(" · "))+'</div>';card.onclick=()=>showDetail(v);$("results").append(card)})}
async function showDetail(v){
 const id=v.vod_id??v.id;let detail=v;
 $("detailBody").innerHTML='<div class="empty">正在读取影片详情和播放线路…</div>';
 $("playerWrap").style.display="none";$("videoPlayer").pause();$("videoPlayer").removeAttribute("src");
 $("modal").classList.add("show");
 if(id!=null){try{const d=await api({source:current.key,ac:"detail",ids:String(id)});const got=(d.list&&d.list[0])||(d.data&&d.data[0])||d.data||d;if(got&&typeof got==="object")detail={...v,...got}}catch(e){$("detailBody").innerHTML='<div class="meta">详情接口读取失败：'+esc(e.message)+'</div>'}}
 const title=detail.vod_name??detail.name??"影片详情",pic=detail.vod_pic??detail.pic??"";
 const raw=String(detail.vod_play_url??detail.play_url??detail.url??"");
 const groups=raw.split("$$$"),names=String(detail.vod_play_from??detail.play_from??"线路").split("$$$");let rows="",n=0;
 groups.forEach((group,i)=>String(group).split("#").forEach(item=>{const pos=item.indexOf("$");if(pos<0)return;const label=item.slice(0,pos).trim()||("第 "+(n+1)+" 集"),url=item.slice(pos+1).trim();if(!url)return;n++;rows+='<div class="playrow"><span>'+esc((names[i]||"线路"+(i+1))+" · "+label)+'</span><button type="button" data-play="'+encodeURIComponent(url)+'">立即播放</button><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">打开地址 ↗</a></div>'}));
 $("detailBody").innerHTML='<div class="detail">'+(pic?'<img src="'+esc(pic)+'" referrerpolicy="no-referrer">':'<div class="poster"></div>')+'<div><h2>'+esc(title)+'</h2><p>'+esc([detail.vod_year,detail.vod_area,detail.vod_type,detail.vod_remarks].filter(Boolean).join(" · "))+'</p><p>导演：'+esc(detail.vod_director||"暂无")+'</p><p>演员：'+esc(detail.vod_actor||"暂无")+'</p><p>'+esc(detail.vod_content||"暂无简介")+'</p></div></div><div class="playlist"><strong>播放线路 · '+n+' 集</strong>'+(rows||'<p class="meta">该源的详情接口仍未返回标准播放字段。可尝试其他线路；此类源可能使用非标准接口或需要专用解析。</p>')+'</div>';
 $("detailBody").querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>playUrl(decodeURIComponent(b.dataset.play)));
}
async function playUrl(url){
 const video=$("videoPlayer"),hint=$("playerHint");$("playerWrap").style.display="block";hint.textContent="正在加载播放地址…";video.pause();video.removeAttribute("src");
 if(window.currentHls){window.currentHls.destroy();window.currentHls=null}
 const clean=url.trim();
 if(/\.m3u8(\?|$)/i.test(clean)){
  if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=clean}
  else{try{if(!window.Hls){await new Promise((resolve,reject)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js";sc.onload=resolve;sc.onerror=reject;document.head.append(sc)})}if(window.Hls&&Hls.isSupported()){window.currentHls=new Hls();window.currentHls.loadSource(clean);window.currentHls.attachMedia(video)}else throw Error("当前浏览器不支持 HLS")}catch(e){hint.textContent="HLS 播放器加载失败："+e.message+"。可点击旁边的「打开地址」尝试外部播放器。";return}}
 }else{video.src=clean}
 hint.textContent="已加载播放地址；如果无法播放，可能是源站防盗链、地址过期或浏览器不支持该编码。";
 try{await video.play()}catch(e){hint.textContent="播放已准备好，请点击视频播放按钮。若仍失败，可能是源站限制或浏览器不支持该格式。"}
}
$("source").onchange=()=>{current=visibleSources.find(s=>s.key===$("source").value);if(current)loadClassesAndList()};
document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll("[data-kind]").forEach(x=>x.classList.toggle("active",x===b));filterSources()});
$("search").onclick=()=>{page=1;loadList()};$("keyword").addEventListener("keydown",e=>{if(e.key==="Enter"){$("search").click()}});
$("category").onchange=()=>{page=1;loadList()};$("prev").onclick=()=>{if(page>1){page--;loadList()}};$("next").onclick=()=>{if(page<pageCount){page++;loadList()}};
$("close").onclick=()=>$("modal").classList.remove("show");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("show")};
loadConfig();
</script></body></html>
